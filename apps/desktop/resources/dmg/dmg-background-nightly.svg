<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="864" viewBox="0 0 960 432">
  <!-- Finder on macOS 26 opens the installer at 920x436 whatever size the DMG
       stores, so the art is centred on x=460 and the last 40pt are spare. -->
  <defs>
    <radialGradient id="glow">
      <stop stop-color="#6F73BB" stop-opacity=".28"/>
      <stop offset="1" stop-color="#5B6BA2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="190.3" y1="0" x2="723.7" y2="213.3" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop stop-color="#07152F"/>
      <stop offset=".5" stop-color="#151443"/>
      <stop offset="1" stop-color="#32155B"/>
    </linearGradient>
    <radialGradient id="skyGlow" cx="0" cy="0" r="1" gradientTransform="translate(617 40) rotate(137) scale(266.7 186.7)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5165D8" stop-opacity=".4"/>
      <stop offset=".5" stop-color="#283075" stop-opacity=".16"/>
      <stop offset="1" stop-color="#07152F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud" x1="-4.3" y1="133.3" x2="915.7" y2="213.3" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4EA4FF" stop-opacity=".5"/>
      <stop offset=".52" stop-color="#696FEA" stop-opacity=".62"/>
      <stop offset="1" stop-color="#A85BEA" stop-opacity=".5"/>
    </linearGradient>
    <filter id="soft" x="-80" y="0" width="1120" height="432" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8.9"/>
    </filter>
    <pattern id="stars" width="640" height="213.3" patternUnits="userSpaceOnUse">
      <g fill="#E4EAFF"><circle cx="31.1" cy="22.2" r="1.3" fill-opacity="0.85"/><circle cx="84.4" cy="48.9" r="0.9" fill-opacity="0.55"/><circle cx="128.9" cy="17.8" r="1.1" fill-opacity="0.7"/><circle cx="186.7" cy="35.6" r="0.9" fill-opacity="0.5"/><circle cx="231.1" cy="15.6" r="1.3" fill-opacity="0.8"/><circle cx="280" cy="44.4" r="0.9" fill-opacity="0.55"/><circle cx="328.9" cy="24.4" r="1.1" fill-opacity="0.7"/><circle cx="377.8" cy="53.3" r="0.9" fill-opacity="0.5"/><circle cx="426.7" cy="20" r="1.3" fill-opacity="0.8"/><circle cx="475.6" cy="40" r="0.9" fill-opacity="0.55"/><circle cx="524.4" cy="17.8" r="1.1" fill-opacity="0.7"/><circle cx="573.3" cy="44.4" r="1" fill-opacity="0.6"/><circle cx="617.8" cy="24.4" r="1.2" fill-opacity="0.75"/><circle cx="57.8" cy="75.6" r="0.9" fill-opacity="0.45"/><circle cx="262.2" cy="75.6" r="0.9" fill-opacity="0.45"/><circle cx="448.9" cy="71.1" r="0.9" fill-opacity="0.5"/><circle cx="595.6" cy="75.6" r="0.9" fill-opacity="0.45"/></g>
      <g stroke="#C8D7FF" stroke-linecap="round" stroke-opacity=".7" stroke-width="1.3"><path d="M152.2 62.2H158.9M155.6 58.9V65.6"/><path d="M352.2 80H358.9M355.6 76.7V83.3"/><path d="M543.3 57.8H550M546.7 54.4V61.1"/></g>
    </pattern>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1">
