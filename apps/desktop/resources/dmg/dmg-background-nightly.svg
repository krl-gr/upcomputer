      <stop offset=".55" stop-color="#6679C3" stop-opacity=".24"/>
      <stop offset="1" stop-color="#C2B8E7" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#AED7D9"/>
      <stop offset=".5" stop-color="#BACAE9"/>
      <stop offset="1" stop-color="#B8A7DE"/>
    </linearGradient>
  </defs>
  <!-- Sky: NightlySkyArt from apps/web/src/components/SidebarStageBackdrop.tsx at 640/288 scale. -->
  <rect width="960" height="432" fill="url(#sky)"/>
  <rect width="960" height="432" fill="url(#skyGlow)"/>
  <rect width="960" height="213.3" fill="url(#stars)"/>
  <path d="M-42.6 195.6C-42.6 164.4 -4.3 140 40.4 140C53.2 111.1 91.5 91.1 136.2 91.1C181 91.1 219.3 108.9 232.1 137.8C248 126.7 270.4 120 296 120C347.1 120 388.6 146.7 391.8 182.2C417.4 184.4 436.5 195.6 446.1 213.3H-42.6V195.6Z" fill="url(#cloud)" filter="url(#soft)"/>
  <path d="M474.9 213.3C478 186.7 510 166.7 548.3 166.7C557.9 142.2 589.9 126.7 628.2 126.7C666.5 126.7 698.5 142.2 708 166.7C733.6 166.7 756 177.8 765.5 193.3C794.3 193.3 816.7 202.2 826.2 213.3H474.9Z" fill="url(#cloud)" fill-opacity=".8" filter="url(#soft)"/>
  <circle cx="625.3" cy="200" r="200" fill="url(#glow)" opacity="1"/>
  <path d="M-86.2 293C136.6 220 307.6 304 520.4 256S803.6 191 1016.3 257" stroke="url(#veil)" stroke-width="146" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M-86.2 306C162.4 252 320.6 298 527.6 272S794.9 242 1016.3 280" stroke="url(#silk)" stroke-width="86" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M-86.2 266C162.4 212 320.6 258 527.6 232S794.9 202 1016.3 240" stroke="#C7F2F1" stroke-width="0.8" fill="none" opacity="0.42" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Up.computer name in place of upstream's T3 wordmark. -->
  <text x="32" y="44" fill="#edf0ff" font-family="Helvetica" font-size="20" font-weight="700">Up.computer</text>
  <text x="888" y="38" fill="#C3C8E5" font-family="Helvetica" font-size="9" font-weight="400" text-anchor="end">NIGHTLY</text>
  <text x="460" y="104" fill="#edf0ff" font-family="Helvetica" font-size="23" font-weight="700" text-anchor="middle">Drag Up.computer into Applications.</text>
  <path d="M410 204Q460 179 510 204M498 190L510 204L491 209" stroke="#ECEDFF" stroke-width="2.2" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="460" y="367" fill="#D0CFE6" font-family="Helvetica" font-size="12" font-weight="400" text-anchor="middle">Once copied, open it from Applications.</text>
</svg>
