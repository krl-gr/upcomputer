name: Deploy UpComputer Connect relay

# UpComputer Connect is optional. The deploy job runs only once the relay is
# configured: set the repository variable RELAY_DOMAIN (or RELAY_API_ZONE_NAME),
# the same switch release.yml uses for its relay config. It must be a
# repository or organization variable: a job-level `if` cannot read variables
# scoped to the production environment. While both are unset, the job is
# skipped and no runner is allocated.
#
# A push that brings an upstream sync merge (a commit whose subject starts with
# "chore(sync): merge upstream", see docs/operations/upstream-sync.md) does not
# deploy: upstream's relay changes go to production only by a manual run of
# this workflow on main, after their config is in place.

on:
  push:
    branches:
      - main
  # Redeploys main after a variable or secret change. Alchemy redeploys the
  # Worker when a value it reads changes, so force is rarely needed.
  workflow_dispatch:
    inputs:
      force:
        description: Redeploy every resource, including ones with no detected changes.
        type: boolean
        default: false

permissions:
  contents: read
  id-token: none
  statuses: write

concurrency:
  group: relay-production
  cancel-in-progress: false

jobs:
  sync_gate:
    name: Skip upstream sync merges
    if: ${{ github.repository == 'krl-gr/upcomputer' && github.ref == 'refs/heads/main' && (vars.RELAY_DOMAIN != '' || vars.RELAY_API_ZONE_NAME != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - name: Checkout history
        if: github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github

      - name: Look for an upstream sync merge in the push
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "push" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          range="$GITHUB_SHA"
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE..$GITHUB_SHA"; fi
          if git log --format=%s "$range" | grep -q '^chore(sync): merge upstream'; then
            echo "::notice::This push brings an upstream sync merge; the relay was not deployed. Run this workflow manually on main to deploy it."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy_relay:
    name: Deploy production relay
    needs: sync_gate
    # A manual run from another branch would deploy that branch to production.
    if: ${{ github.repository == 'krl-gr/upcomputer' && github.ref == 'refs/heads/main' && (vars.RELAY_DOMAIN != '' || vars.RELAY_API_ZONE_NAME != '') && needs.sync_gate.outputs.deploy == 'true' }}
    # GitHub-hosted: Blacksmith runners are not set up for the Up.computer repository.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PLANETSCALE_ORGANIZATION: ${{ vars.PLANETSCALE_ORGANIZATION }}
      AXIOM_ORG_ID: ${{ vars.AXIOM_ORG_ID }}
      RELAY_DOMAIN: ${{ vars.RELAY_DOMAIN }}
      RELAY_API_ZONE_NAME: ${{ vars.RELAY_API_ZONE_NAME }}
      RELAY_TUNNEL_ZONE_NAME: ${{ vars.RELAY_TUNNEL_ZONE_NAME }}
      RELAY_TUNNEL_CLEANUP_MODE: ${{ vars.RELAY_TUNNEL_CLEANUP_MODE }}
      RELAY_LEGACY_TUNNEL_CLEANUP_MODE: ${{ vars.RELAY_LEGACY_TUNNEL_CLEANUP_MODE }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      CLERK_JWT_AUDIENCE: ${{ vars.CLERK_JWT_AUDIENCE }}
      # Axiom monitors and the health dashboard: created only while the paging
      # notifier is set; warnings use their own notifier, or only show in Axiom.
      RELAY_ALERT_NOTIFIER_ID: ${{ vars.RELAY_ALERT_NOTIFIER_ID }}
      RELAY_WARNING_NOTIFIER_ID: ${{ vars.RELAY_WARNING_NOTIFIER_ID }}
      # APNs stays off until the variable is set to true. Only then does the
      # deploy read the APNS_* variables and the APNS_PRIVATE_KEY secret.
      APNS_ENABLED: ${{ vars.APNS_ENABLED || 'false' }}
      APNS_ENVIRONMENT: ${{ vars.APNS_ENVIRONMENT }}
      APNS_TEAM_ID: ${{ vars.APNS_TEAM_ID }}
      APNS_KEY_ID: ${{ vars.APNS_KEY_ID }}
      APNS_BUNDLE_ID: ${{ vars.APNS_BUNDLE_ID }}
      # Web push stays off until the variable is set to true. Only then does
      # the deploy read the VAPID public key, the subject and the
      # WEB_PUSH_VAPID_PRIVATE_KEY secret.
      WEB_PUSH_ENABLED: ${{ vars.WEB_PUSH_ENABLED || 'false' }}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${{ vars.WEB_PUSH_VAPID_PUBLIC_KEY }}
      WEB_PUSH_SUBJECT: ${{ vars.WEB_PUSH_SUBJECT }}
      ALCHEMY_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3code-relay...

      - name: Deploy production relay stage
        # Alchemy runs straight from the relay package: `vp run` would load every
        # workspace package's config, and only the relay's dependencies are installed.
        working-directory: infra/relay
        run: ./node_modules/.bin/alchemy deploy --stage prod --yes --no-input ${{ inputs.force && '--force' || '' }}
        env:
          # The PublishClientConfig action writes the client env here instead
          # of the repo-root .env; nothing on the runner reads it.
          T3CODE_RELAY_CLIENT_CONFIG_ENV: ${{ runner.temp }}/relay-client-config.env
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLANETSCALE_API_TOKEN_ID: ${{ secrets.PLANETSCALE_API_TOKEN_ID }}
          PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
          T3CHAT_LINK_SECRET: ${{ secrets.T3CHAT_LINK_SECRET }}

      - name: Publish relay deploy commit status
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "success",
              context: "Relay deploy / production",
              description: "Relay production deploy completed.",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
